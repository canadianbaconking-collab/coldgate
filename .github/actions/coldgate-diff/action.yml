name: Coldgate Diff
description: Compare two saved authority snapshots and write a review summary
inputs:
  before:
    description: Baseline JSON snapshot path within the workspace
    required: true
  after:
    description: Candidate JSON snapshot path within the workspace
    required: true
  fail-on:
    description: Use change for all differences, selected for listed categories, or never to report only
    default: change
  categories:
    description: Comma-separated area:direction selectors when fail-on is selected
    required: false
runs:
  using: composite
  steps:
    - name: Compare authority snapshots
      shell: bash
      run: node "$GITHUB_ACTION_PATH/run.mjs"
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        COLDGATE_DIFF_BEFORE: ${{ inputs.before }}
        COLDGATE_DIFF_AFTER: ${{ inputs.after }}
        COLDGATE_DIFF_FAIL_ON: ${{ inputs.fail-on }}
        COLDGATE_DIFF_CATEGORIES: ${{ inputs.categories }}
