name: Integration smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run verify:package

  action:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Selected weakening fails
        id: weakening
        continue-on-error: true
        uses: ./.github/actions/coldgate-diff
        with:
          before: examples/diff/before.json
          after: examples/diff/after.json
          fail-on: selected
          categories: approval:weakening
      - name: Unselected change passes
        uses: ./.github/actions/coldgate-diff
        with:
          before: examples/diff/before.json
          after: examples/diff/after.json
          fail-on: selected
          categories: approval:strengthening
      - name: Verify hosted gate and summary
        env:
          WEAKENING_OUTCOME: ${{ steps.weakening.outcome }}
        run: |
          test "$WEAKENING_OUTCOME" = failure
          grep -F 'Category: approval:weakening' "$GITHUB_STEP_SUMMARY"
