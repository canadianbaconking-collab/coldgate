name: Integration smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run verify:package

  action:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Selected weakening fails
        id: weakening
        continue-on-error: true
        uses: ./.github/actions/coldgate-diff
        with:
          before: examples/diff/before.json
          after: examples/diff/after.json
          fail-on: selected
          categories: approval:weakening
      - name: Unselected change passes
        uses: ./.github/actions/coldgate-diff
        with:
          before: examples/diff/before.json
          after: examples/diff/after.json
          fail-on: selected
          categories: approval:strengthening
      - name: Verify hosted gate
        env:
          WEAKENING_OUTCOME: ${{ steps.weakening.outcome }}
        run: |
          test "$WEAKENING_OUTCOME" = failure
